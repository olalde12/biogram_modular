{% extends "base.html" %}

{% block titulo %}
Inicio
{% endblock %}

{% block contenido %}

{% block css %}

<link rel="stylesheet" href="{{ url_for('static', path='css/identificacion.css') }}">

<link rel="stylesheet" href="{{ url_for('static', path='css/tutorial.css') }}">

{% endblock %}

<section class="home">

    <div class="left-content">

        <h2>¿Qué deseas hacer hoy?</h2>

        <button id="btnIdentificar" class="btn btn-principal" onclick="window.location.href='identificacion'">
            Identificar bacteria
        </button>

        <button id="btnBuscar" class="btn btn-principal" onclick="window.location.href='buscarbacteria'">
            Buscar bacteria
        </button>

    </div>

    <div class="right-content">
        <div class="text-intro">
            <h1>
                {% if usuario %}
                ¡Hola, {{ usuario.nombre|capitalize }}!
                {% else %}
                ¡Bienvenid@!
                {% endif %}
            </h1>
        </div>
        <div class="btn-right-content">
            <button id="btnHistorial" class="btn btn-principal" data-autenticado="{{ 'true' if request.session.get('id_usuario') else 'false' }}">
                Historial
            </button>
            <button id="btnEscanear" class="btn btn-principal" onclick="window.location.href='/escaner'">
                Escanear pruebas
            </button>
        </div>

    </div>

</section>
