{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', path='css/identificacion.css') }}">
{% endblock %}


{% block contenido %}

<!--Pantalla inicial-->
<div id="pantallaCarga">
    <h1>Identificación bacteriana</h1>
</div>
<!--Todo el contenido de la pagina-->
<main id="contenido">
    <div class="identificacion-container">
        <!--Barra de progreso-->
        <section class="progress-container">
            <h3 class="progress-title">
                Identificación bacteriana
            </h3>

            <p class="progress-text">
                Paso
                <span id="pasoActual">1</span>
                de
                <span id="totalPasos">2</span>
            </p>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">
                </div>
            </div>

        </section>

        <!--Tarjeta-->
        <section class="card">
            <!-- Encabezado -->
            <div class="card-header">
                <h2 id="tituloPrueba">Tinción de Gram</h2>

                <button class="dictionary-btn">
                    <i class="fa-solid fa-book-open"></i>
                    Diccionario
                </button>
            </div>
            <!-- Pregunta -->
            <p class="question" id="preguntaPrueba">
                Selecciona el resultado obtenido.
            </p>

            <!-- Opciones -->
            <div class="options" id="contenedorOpciones">
                <button class="option" data-value="positivo">
                    Gram positivo
                </button>
                <button class="option" data-value="negativo">
                    Gram negativo
                </button>
            </div>

            <!-- Navegación -->
            <div class="card-footer">

                <button class="back">
                    <i class="fa-solid fa-caret-left"></i>
                    Atrás
                </button>

                <button class="continue" disabled>
                    Continuar
                    <i class="fa-solid fa-caret-right"></i>
                </button>
            </div>
        </section>
    </div>
</main>

{% block js %}

<script src="{{ url_for('static', path='js/identificacion.js') }}"></script>

{% endblock %}

{% endblock %}
